name: Build and Publish Container Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Publish Image via Spring Boot Buildpacks
        run: |
          ./gradlew bootBuildImage \
            --imageName=ghcr.io/${{ github.repository_owner }}/wf-springboot:latest \
            --publishRegistry=ghcr.io \
            --publishRegistryUsername=${{ github.actor }} \
            --publishRegistryPassword=${{ secrets.GITHUB_TOKEN }}
